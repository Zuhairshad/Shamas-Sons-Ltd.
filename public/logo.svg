<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 285" fill="none">
  <!-- Cap (white with S-swirl) -->
  <rect x="74" y="2" width="52" height="38" rx="8" fill="white"/>
  <!-- S-curve on cap -->
  <path d="M82 8 C88 13 105 18 112 22 C105 27 88 32 82 38"
        stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M76 40 L76 54 Q74 56 72 60 L128 60 Q126 56 124 54 L124 40 Z" fill="black"/>

  <!-- Bottle body -->
  <path d="M72 60
           Q42 82 38 124
           Q34 166 44 192
           Q54 218 100 224
           Q146 218 156 192
           Q166 166 162 124
           Q158 82 128 60 Z"
        fill="black"/>

  <!-- Main white S-ribbon (outer edge) -->
  <path d="M124 60
           C148 80 152 108 140 132
           C128 155 100 166 90 188
           C80 210 84 220 100 224"
        stroke="white" stroke-width="16" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Black centre line of ribbon for depth -->
  <path d="M116 60
           C138 80 142 106 132 130
           C122 152 96 164 86 185
           C78 204 82 216 96 222"
        stroke="black" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight gloss on bottle right side -->
  <path d="M136 72 C148 90 152 115 148 140"
        stroke="white" stroke-width="4" fill="none"
        stroke-linecap="round" opacity="0.35"/>

  <!-- ── Text ── -->
  <!-- SHAMAS -->
  <text x="100" y="253"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="30"
        font-weight="900"
        letter-spacing="3"
        fill="black">SHAMAS</text>

  <!-- Decorative lines + & -->
  <line x1="14"  y1="264" x2="76"  y2="264" stroke="black" stroke-width="1.5"/>
  <text x="100" y="268"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="black">&amp;</text>
  <line x1="124" y1="264" x2="186" y2="264" stroke="black" stroke-width="1.5"/>

  <!-- SONS -->
  <text x="100" y="283"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="400"
        letter-spacing="7"
        fill="black">SONS</text>
</svg>
